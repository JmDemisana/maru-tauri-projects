[package]
name = "maru-scanner"
version = "1.0.0"
description = "Maru Scanner Modern Desktop UI"
authors = ["Maru"]
edition = "2021"

[lib]
name = "maru_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
maru-core = { workspace = true }
uuid = { workspace = true }

