[package]
name = "kontext"
version = "0.1.0"
description = "Kontext VN dialogue OCR + offline context-aware translation + overlay"
authors = ["Maru"]
edition = "2021"

[lib]
name = "kontext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
xcap = "0.4"
image = "0.25"
